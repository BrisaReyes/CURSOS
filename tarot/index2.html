
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10070b">
<meta name="description" content="ASTRO ROJO — Curso de Tarot: Arcanos Menores, cuatro palos, cartas invertidas y métodos de lectura.">
<title>ASTRO ROJO — Arcanos Menores</title>

<style>
:root {
  --bg: #0b080a;
  --panel: #151014;
  --panel2: #1b1217;
  --red: #e51b3e;
  --red2: #ff526d;
  --cream: #f4edf0;
  --muted: #b8a9b0;
  --line: rgba(255,255,255,.11);
  --gold: #d6b47b;
  --radius: 22px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  margin: 0;
  background:
    radial-gradient(ellipse at 80% 0%, #32101a 0, transparent 35%),
    var(--bg);
  color: var(--cream);
  font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.65;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input {
  font: inherit;
}

.wrap {
  width: min(1160px, calc(100% - 34px));
  margin: auto;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(11,8,10,.88);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--line);
}

.nav {
  min-height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.brand {
  font-weight: 900;
  letter-spacing: .17em;
  font-size: .88rem;
}

.brand span {
  color: var(--red2);
}

.navlinks {
  display: flex;
  gap: 17px;
  align-items: center;
  font-size: .83rem;
  color: var(--muted);
}

.navlinks a:hover {
  color: white;
}

.navlinks .next {
  color: white;
  background: var(--red);
  padding: 9px 13px;
  border-radius: 999px;
}

.hero {
  padding: 76px 0 52px;
  position: relative;
  overflow: hidden;
}

.hero:after {
  content: "☾";
  position: absolute;
  right: 5%;
  top: 4px;
  font-size: clamp(150px,25vw,310px);
  line-height: 1;
  color: rgba(229,27,62,.10);
  pointer-events: none;
}

.eyebrow {
  color: var(--red2);
  text-transform: uppercase;
  letter-spacing: .22em;
  font-size: .72rem;
  font-weight: 800;
}

.hero h1 {
  font-size: clamp(2.8rem,8vw,6.5rem);
  line-height: .94;
  letter-spacing: -.065em;
  max-width: 850px;
  margin: 18px 0;
}

.hero h1 span {
  display: block;
  color: var(--red2);
  font-family: Georgia, serif;
  font-style: italic;
  font-weight: 500;
  letter-spacing: -.045em;
}

.hero p {
  max-width: 680px;
  color: #d0c1c7;
  font-size: 1.08rem;
}

.hero-actions {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 25px;
}

.btn {
  border: 1px solid var(--line);
  background: #20151b;
  color: white;
  padding: 12px 18px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: .2s;
}

.btn.primary {
  background: var(--red);
  border-color: var(--red);
}

.btn:hover {
  transform: translateY(-2px);
  border-color: var(--red2);
}

.course-strip {
  border-block: 1px solid var(--line);
  background: rgba(255,255,255,.025);
}

.strip-inner {
  display: grid;
  grid-template-columns: repeat(4,1fr);
}

.strip-item {
  padding: 19px 20px;
  border-right: 1px solid var(--line);
}

.strip-item:last-child {
  border: 0;
}

.strip-item strong {
  display: block;
  font-size: 1.05rem;
}

.strip-item small {
  color: var(--muted);
}

section {
  padding: 70px 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  gap: 25px;
  align-items: end;
  margin-bottom: 28px;
}

.section-head h2 {
  font-size: clamp(2rem,5vw,3.5rem);
  line-height: 1.02;
  letter-spacing: -.045em;
  margin: 8px 0 0;
}

.section-head p {
  max-width: 450px;
  color: var(--muted);
  margin: 0;
}

.intro-grid {
  display: grid;
  grid-template-columns: 1.2fr .8fr;
  gap: 20px;
}

.feature {
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: linear-gradient(145deg,#21131a,#110d10);
}

.feature h3 {
  font-size: 1.35rem;
  margin: 0 0 10px;
}

.feature p {
  color: #cbbdc3;
  margin: 0;
}

.feature-mark {
  font-family: Georgia,serif;
  font-size: 4rem;
  color: var(--red2);
  line-height: 1;
  margin-bottom: 15px;
}

.topic-grid {
  display: grid;
  grid-template-columns: repeat(4,minmax(0,1fr));
  gap: 14px;
}

.topic {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--panel);
  min-height: 160px;
}

.topic .num {
  color: var(--red2);
  font-size: .72rem;
  letter-spacing: .15em;
  font-weight: 800;
}

.topic h3 {
  margin: 10px 0 6px;
}

.topic p {
  color: var(--muted);
  font-size: .91rem;
  margin: 0;
}

.toolbar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 20px 0 24px;
}

.search {
  flex: 1;
  min-width: 220px;
  background: #171116;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 13px 17px;
  color: white;
  outline: none;
}

.search:focus {
  border-color: var(--red2);
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.filter {
  border: 1px solid var(--line);
  color: #d5c8ce;
  background: #171116;
  padding: 10px 14px;
  border-radius: 999px;
  cursor: pointer;
}

.filter.active,
.filter:hover {
  background: var(--red);
  border-color: var(--red);
  color: white;
}

.suit-intro {
  display: flex;
  align-items: center;
  gap: 16px;
  margin: 38px 0 16px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
}

.suit-symbol {
  width: 47px;
  height: 47px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(229,27,62,.5);
  border-radius: 15px;
  color: var(--red2);
  font-size: 1.4rem;
  background: #210d14;
}

.suit-intro h3 {
  margin: 0;
  font-size: 1.5rem;
}

.suit-intro p {
  margin: 0;
  color: var(--muted);
  font-size: .9rem;
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(7,minmax(0,1fr));
  gap: 12px;
}

.tarot-card {
  cursor: pointer;
  text-align: left;
  background: linear-gradient(160deg,#1b1217,#100c0f);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 9px;
  color: white;
  transition: transform .2s,border-color .2s;
  min-width: 0;
}

.tarot-card:hover {
  transform: translateY(-5px);
  border-color: var(--red2);
}

.tarot-card img {
  display: block;
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  border-radius: 8px;
  background: #29151d;
}

.tarot-card strong {
  display: block;
  font-size: .8rem;
  line-height: 1.25;
  margin: 9px 2px 3px;
}

.tarot-card small {
  display: block;
  color: var(--muted);
  font-size: .7rem;
  margin: 0 2px 3px;
}

.more-row {
  display: flex;
  justify-content: center;
  margin: 18px 0 6px;
}

.show-more {
  font-size: .9rem;
  padding: 10px 18px;
}

.empty {
  display: none;
  color: var(--muted);
  padding: 25px;
  text-align: center;
}

.info-band {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 14px;
}

.info-card {
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 23px;
  background: linear-gradient(145deg,#1c1217,#100c0e);
}

.info-card h3 {
  margin: 0 0 8px;
}

.info-card p {
  color: var(--muted);
  margin: 0;
}

.symbol {
  color: var(--red2);
  font-size: 1.6rem;
}

.steps {
  counter-reset: step;
  display: grid;
  grid-template-columns: repeat(4,1fr);
  gap: 12px;
}

.step {
  counter-increment: step;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--panel);
}

.step:before {
  content: "0" counter(step);
  display: block;
  color: var(--red2);
  font-weight: 900;
  letter-spacing: .15em;
  margin-bottom: 12px;
}

.step h3 {
  font-size: 1rem;
  margin: 0 0 7px;
}

.step p {
  color: var(--muted);
  font-size: .9rem;
  margin: 0;
}

.ethics {
  border: 1px solid rgba(229,27,62,.35);
  background: linear-gradient(120deg,rgba(229,27,62,.12),rgba(255,255,255,.02));
  border-radius: var(--radius);
  padding: clamp(23px,5vw,44px);
}

.ethics h2 {
  font-size: clamp(1.8rem,4vw,3rem);
  margin: 8px 0;
}

.ethics p {
  color: #d1c3c9;
  max-width: 820px;
}

.final-section {
  text-align: center;
  padding: 65px 0 80px;
}

.final-section h2 {
  font-family: Georgia,serif;
  font-style: italic;
  font-size: clamp(2rem,6vw,4.3rem);
  font-weight: 500;
  margin: 12px auto;
}

.final-section p {
  color: var(--muted);
  max-width: 620px;
  margin: 0 auto 23px;
}

.footer {
  border-top: 1px solid var(--line);
  padding: 22px 0;
  color: var(--muted);
  font-size: .82rem;
}

.footer-inner {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,.82);
  padding: 18px;
  backdrop-filter: blur(8px);
}

.modal.open {
  display: flex;
}

.modal-box {
  position: relative;
  max-width: 820px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  background: #130d11;
  border: 1px solid rgba(255,82,109,.35);
  border-radius: 24px;
  padding: 25px;
}

.modal-close {
  position: absolute;
  right: 15px;
  top: 12px;
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 38px;
  height: 38px;
  background: #24141b;
  color: white;
  cursor: pointer;
  font-size: 1.2rem;
}

.modal-content {
  display: grid;
  grid-template-columns: minmax(150px,.7fr) 1.3fr;
  gap: 25px;
  padding-top: 15px;
}

.modal-content img {
  width: 100%;
  border-radius: 12px;
  max-height: 480px;
  object-fit: contain;
  background: #24141b;
}

.modal-content h2 {
  font-size: 2rem;
  line-height: 1.1;
  margin: 8px 0;
}

.modal-content p {
  color: #d2c4ca;
}

.modal-content h3 {
  margin-bottom: 3px;
  color: var(--red2);
  font-size: 1rem;
}

.pill {
  display: inline-block;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 10px;
  color: var(--muted);
  font-size: .78rem;
}

.note {
  font-size: .82rem;
  color: var(--muted);
  margin-top: 10px;
}

.hidden {
  display: none !important;
}

@media(max-width:900px) {
  .cards-grid { grid-template-columns: repeat(5,minmax(0,1fr)); }
  .topic-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .steps { grid-template-columns: repeat(2,1fr); }
  .navlinks { gap: 10px; }
  .navlinks a:not(.next) { display: none; }
}

@media(max-width:600px) {
  .wrap { width: min(100% - 24px,1160px); }
  .hero { padding: 53px 0 39px; }
  .strip-inner { grid-template-columns: repeat(2,1fr); }
  .strip-item:nth-child(2) { border-right: 0; }
  .strip-item:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  section { padding: 48px 0; }
  .section-head { display: block; }
  .section-head p { margin-top: 12px; }
  .intro-grid,.info-band { grid-template-columns: 1fr; }
  .cards-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 9px; }
  .tarot-card { padding: 6px; }
  .tarot-card strong { font-size: .74rem; }
  .suit-intro { margin-top: 28px; }
  .modal-content { grid-template-columns: 1fr; }
  .modal-content img {
    max-height: 320px;
    width: auto;
    max-width: 100%;
    margin: auto;
  }
  .modal-box { padding: 17px; }
  .steps { gap: 9px; }
  .step { padding: 15px; }
  .hero:after { right: -12%; top: 20px; }
}

.tarot-image.image-missing {
  object-fit: contain;
  background: #180d12;
  padding: 12px;
  color: #ff526d;
  font-size: 12px;
}

#cartas .section-head h2 {
  font-style: normal !important;
  font-family: inherit !important;
}
</style>
</head>
