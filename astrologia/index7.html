    <style>
        .ejercicios-header {

        }

        }

        .progreso {

            margin: 0 auto 35px;
        }

        .progreso-superior {

        }

        .progreso-superior span {

            font-size: 12px;
            letter-spacing: 1px;
        }

        .progreso-superior strong {
            color: #c9828c;
            font-size: 13px;
            font-weight: 400;
        }

        .barra-progreso {
            height: 4px;
            background: rgba(150,35,50,.15);
            border-radius: 10px;
            overflow: hidden;
        }

        .barra-progreso span {
            display: block;
            width: 0;
            height: 100%;
            background: #a93648;
            transition: width .4s ease;
        }

        .ejercicio-panel {
            position: relative;
            max-width: 850px;
            margin: 0 auto 35px;
            padding: 45px;
            background: linear-gradient(
                145deg,
                rgba(255,255,255,.045),
                rgba(100,0,15,.025)
            );
            border: 1px solid rgba(150,35,50,.35);
            border-radius: 22px;
            box-shadow: 0 20px 60px rgba(0,0,0,.3);

        }

        .ejercicio-etiqueta {
            text-align: center;
            color: #a93648;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        .ejercicio-panel h2 {
            text-align: center;
            color: #eee9e4;
            font-size: 25px;
            font-weight: 400;
            margin: 0 0 30px;
        }

        .carta-practica {
            width: 100%;
            max-width: 270px;
            min-height: 210px;
            margin: 0 auto 30px;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            background: radial-gradient(
                circle at 50% 20%,
                rgba(130,0,25,.35),

            box-shadow: 0 15px 45px rgba(0,0,0,.35);
        }

            font-size: 38px;
            color: #a93648;
            margin-bottom: 18px;
        }

            color: #8f8589;
            font-size: 10px;

            margin-bottom: 12px;
        }

        .carta-practica h3 {
            color: #f3eeee;
            font-size: 21px;
            font-weight: 400;
            line-height: 1.5;
            margin: 0;
        }

            margin: 0 auto 28px;
            text-align: center;
        }

        .pregunta-label {
            display: block;
            color: #a93648;
            font-size: 10px;

        }

            font-size: 16px;
            line-height: 1.8;
            margin: 0;
        }

            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
            max-width: 760px;
            margin: auto;
        }

        .opcion {
            min-width: 0;
            min-height: 155px;
            padding: 22px 18px;
            text-align: left;
            box-sizing: border-box;
            background: rgba(12,6,9,.6);
            border: 1px solid rgba(150,35,50,.25);
            border-radius: 16px;
            cursor: pointer;
            transition: .25s ease;
        }

        .opcion:hover {
            transform: translateY(-4px);
            border-color: rgba(190,55,70,.65);
            background: rgba(35,7,12,.8);
        }

        .opcion-letra {
            display: flex;

            height: 31px;
            align-items: center;
            justify-content: center;

            border: 1px solid rgba(169,54,72,.5);

        }

            margin: 0;
            overflow-wrap: anywhere;
        }

        .opcion.correcta {

        }

        .opcion.correcta .opcion-letra {
            background: #8f2638;
            color: white;
        }

        .opcion.incorrecta {
            opacity: .5;
        }

        .opcion.bloqueada {
            cursor: default;
        }

        .opcion.bloqueada:hover {
            transform: none;
        }

        .resultado {
            display: none;
            max-width: 700px;
            margin: 28px auto 0;
            padding: 24px;
            box-sizing: border-box;
            background: rgba(35,7,12,.7);

        }

            letter-spacing: 1px;
            margin-bottom: 10px;
        }

            font-size: 14px;
            line-height: 1.8;

        }

        }

            display: none;
            max-width: 650px;
            margin: 30px auto;
            padding: 35px 30px;
            text-align: center;
            box-sizing: border-box;

            display: block;
        }

            font-size: 38px;
            color: #a93648;
            margin-bottom: 15px;
        }

        .resultado-final h2 {
            color: #eee9e4;
            font-weight: 400;
            margin-bottom: 15px;
        }

        .resultado-final p {
            color: #a8a0a3;
            font-size: 14px;
            line-height: 1.8;
        }

        .resultado-final strong {
            color: #c9828c;
        }

            margin-top: 22px;
            padding: 12px 25px;
            color: #f3eeee;

            border: 1px solid rgba(190,70,85,.55);
            border-radius: 30px;

            .opciones {
                grid-template-columns: minmax(0,1fr);
                max-width: 550px;
            }

            .opcion {
                min-height: auto;
            }

            .ejercicio-panel {
                padding: 35px 25px 40px;
            }
        }

        @media (max-width: 500px) {
            .ejercicios-header h1 {
                font-size: 27px;
                letter-spacing: 2px;
            }

                font-size: 21px;
            }

            .pregunta p {
                font-size: 15px;
            }
        }
    </style>
</head>

let ejercicioActual = 0;
let aciertos = 0;
let respondidos = 0;

const contenedor = document.getElementById("contenedor-ejercicios");

function crearEjercicios() {
    ejercicios.forEach((ejercicio, indice) => {
        const numero = indice + 1;
        const panel = document.createElement("section");

        panel.className = "ejercicio-panel";
        panel.id = "ejercicio-" + numero;

        if (indice !== 0) {
            panel.style.display = "none";
        }

        const letras = ["A", "B", "C"];

        panel.innerHTML = `
            <div class="ejercicio-etiqueta">
                EJERCICIO ${String(numero).padStart(2, "0")}
            </div>

            <h2>${ejercicio.titulo}</h2>

            <div class="carta-practica">
                <div class="simbolo">${ejercicio.simbolo}</div>
                <small>${ejercicio.etiqueta}</small>
                <h3>${ejercicio.carta.replace(/\n/g, "<br>")}</h3>
            </div>

            <div class="pregunta">
                <span class="pregunta-label">PREGUNTA</span>
                <p>${ejercicio.pregunta}</p>
            </div>

            <div class="opciones">
                ${ejercicio.opciones.map((opcion, i) => `
                    <div class="opcion"
                         role="button"
                         tabindex="0"
                         data-indice="${i}">
                        <span class="opcion-letra">${letras[i]}</span>
                        <p>${opcion}</p>
                    </div>
                `).join("")}
            </div>

            <div class="resultado" id="resultado-${numero}" aria-live="polite">
                <div class="resultado-titulo"></div>
                <p></p>
            </div>

            <button class="boton-siguiente-ejercicio"
                    id="siguiente-${numero}">
                ${numero === ejercicios.length
                    ? "VER RESULTADO FINAL →"
                    : "SIGUIENTE EJERCICIO →"}
            </button>
        `;

        contenedor.appendChild(panel);

        panel.querySelectorAll(".opcion").forEach(opcion => {
            opcion.addEventListener("click", () => {
                responder(opcion, numero);
            });

            opcion.addEventListener("keydown", evento => {
                if (evento.key === "Enter" || evento.key === " ") {
                    evento.preventDefault();
                    responder(opcion, numero);
                }
            });
        });

        panel.querySelector(".boton-siguiente-ejercicio")
            .addEventListener("click", () => {
                if (numero < ejercicios.length) {
                    mostrarEjercicio(numero + 1);
                } else {
                    mostrarResultadoFinal();
                }
            });
    });
}

function responder(elemento, numero) {
    const panel = document.getElementById("ejercicio-" + numero);

    if (panel.dataset.respondido === "true") {
        return;
    }

    panel.dataset.respondido = "true";

    const ejercicio = ejercicios[numero - 1];
    const opciones = panel.querySelectorAll(".opcion");
    const seleccion = Number(elemento.dataset.indice);
    const correcta = seleccion === ejercicio.correcta;

    respondidos++;

    if (correcta) {
        aciertos++;
    }

    opciones.forEach((opcion, indice) => {
        opcion.classList.add("bloqueada");
        opcion.setAttribute("aria-disabled", "true");

        if (indice === ejercicio.correcta) {
            opcion.classList.add("correcta");
        } else if (indice === seleccion) {
            opcion.classList.add("incorrecta");
        }
    });

    const resultado = document.getElementById("resultado-" + numero);
    const titulo = resultado.querySelector(".resultado-titulo");
    const texto = resultado.querySelector("p");

    titulo.textContent = correcta
        ? "✓ RESPUESTA CORRECTA"
        : "✦ REPASEMOS LA RESPUESTA";

    texto.textContent = ejercicio.explicacion;
    resultado.classList.add("visible");

    panel.querySelector(".boton-siguiente-ejercicio")
        .classList.add("visible");
}

function mostrarEjercicio(numero) {
    document.getElementById("ejercicio-" + ejercicioActualActual())
        ?.style.setProperty("display", "none");

    const siguiente = document.getElementById("ejercicio-" + numero);
    siguiente.style.display = "block";

    ejercicioActual = numero - 1;

    document.getElementById("contador").textContent =
        numero + " / " + ejercicios.length;

    document.getElementById("barra").style.width =
        (numero / ejercicios.length * 100) + "%";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function ejercicioActualActual() {
    return ejercicioActual + 1;
}

function mostrarResultadoFinal() {
    document.getElementById("ejercicio-" + ejercicios.length)
        .style.display = "none";

    document.getElementById("contador").textContent =
        ejercicios.length + " / " + ejercicios.length;

    document.getElementById("barra").style.width = "100%";

    const porcentaje = Math.round((aciertos / ejercicios.length) * 100);

    let mensaje;

    if (porcentaje >= 85) {
        mensaje = "¡Excelente trabajo! ";
    } else if (porcentaje >= 60) {
        mensaje = "¡Buen avance! ";
    } else {
        mensaje = "¡La práctica continúa! ";
    }

    document.getElementById("mensaje-final").innerHTML =
        mensaje +
        "Respondiste correctamente <strong>" + aciertos +
        " de " + ejercicios.length + " preguntas (" +
        porcentaje + "%)</strong>. Revisá las explicaciones y volvé a practicar para afianzar los conceptos.";

    document.getElementById("resultado-final")
        .classList.add("visible");

    window.scrollTo({ top: 0, behavior: "smooth" });
}

function reiniciarCurso() {
    ejercicioActual = 0;
    aciertos = 0;
    respondidos = 0;

    ejercicios.forEach((_, indice) => {
        const panel = document.getElementById("ejercicio-" + (indice + 1));
        panel.dataset.respondido = "false";
        panel.style.display = indice === 0 ? "block" : "none";

        panel.querySelectorAll(".opcion").forEach(opcion => {
            opcion.classList.remove("correcta", "incorrecta", "bloqueada");
            opcion.removeAttribute("aria-disabled");
        });

        panel.querySelector(".resultado").classList.remove("visible");
        panel.querySelector(".boton-siguiente-ejercicio")
            .classList.remove("visible");
    });

    document.getElementById("resultado-final")
        .classList.remove("visible");

    document.getElementById("contador").textContent =
        "1 / " + ejercicios.length;

    document.getElementById("barra").style.width = "0%";

    window.scrollTo({ top: 0, behavior: "smooth" });
}

crearEjercicios();
</script>

</body>
</html>
